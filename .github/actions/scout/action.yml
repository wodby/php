name: Scan image vulnerabilities
description: Report all CVEs and reject fixable high or critical vulnerabilities
inputs:
  image:
    description: Exact local or registry image reference to scan
    required: true
  platform:
    description: Platform to scan when using a registry image
    required: false
  only-fixed:
    description: Limit the release gate to vulnerabilities with an available fix
    default: 'true'
  dockerhub-user:
    description: Docker Hub user for Scout authentication
    required: true
  dockerhub-password:
    description: Docker Hub token for Scout authentication
    required: true
runs:
  using: composite
  steps:
    - name: Report all vulnerabilities
      uses: docker/scout-action@v1
      with:
        command: cves
        image: ${{ inputs.image }}
        platform: ${{ inputs.platform }}
        exit-code: false
        write-comment: false
        dockerhub-user: ${{ inputs.dockerhub-user }}
        dockerhub-password: ${{ inputs.dockerhub-password }}
    - name: Check high and critical vulnerabilities
      uses: docker/scout-action@v1
      with:
        command: cves
        image: ${{ inputs.image }}
        platform: ${{ inputs.platform }}
        only-severities: critical,high
        only-fixed: ${{ inputs.only-fixed }}
        exit-code: true
        write-comment: false
        dockerhub-user: ${{ inputs.dockerhub-user }}
        dockerhub-password: ${{ inputs.dockerhub-password }}
