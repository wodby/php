# Temporary acceptance for the vendor daemon bundled with New Relic 12.10.0.39.
# Remove when the vendor ships fixed gRPC; review by 2026-10-16.
# Tracking: https://github.com/wodby/php/issues/234
# Upstream: https://github.com/newrelic/newrelic-php-agent/issues/1294
ignore:
  - vulnerability: CVE-2026-84304
    include-aliases: true
    reason: Temporary vendor New Relic exception; tracked in wodby/php#234.
    package:
      name: google.golang.org/grpc
      version: v1.83.0
      type: go-module
      location: /usr/bin/newrelic-daemon
  - vulnerability: CVE-2026-84445
    include-aliases: true
    reason: Temporary vendor New Relic exception; tracked in wodby/php#234.
    package:
      name: google.golang.org/grpc
      version: v1.83.0
      type: go-module
      location: /usr/bin/newrelic-daemon
