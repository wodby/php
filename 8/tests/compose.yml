services:
  nginx:
    image: wodby/nginx
    environment:
      NGINX_BACKEND_HOST: php
      NGINX_VHOST_PRESET: php
    depends_on:
      - php

  sshd:
    image: $IMAGE
    command: sudo /usr/sbin/sshd -De
    volumes:
      - ./authorized_keys:/home/wodby/.ssh/authorized_keys
    environment:
      DEBUG: 1

  php:
    image: $IMAGE
    environment:
      SSH_DISABLE_STRICT_KEY_CHECKING: 1
      PHP_XDEBUG_MODE: debug
      PHP_EXTENSIONS_DISABLE: ''
      PHP_NEWRELIC_ENABLED: 1
      ROWS: 80
    volumes:
      - ./tests.sh:/usr/local/bin/tests.sh
      - ./extensions.php:/usr/local/bin/extensions.php:ro
      - ./functional:/usr/local/bin/functional:ro
      - ./php_modules:/home/wodby/php_modules
      - ./id_rsa:/home/wodby/.ssh/id_rsa
    depends_on:
      - sshd

  crond:
    image: $IMAGE
    command: sudo -E crond -f -d 0
    volumes:
      - ./crontab:/etc/crontabs/www-data
    depends_on:
      - sshd

  redis:
    image: redis:8-alpine

  memcached:
    image: memcached:1.6-alpine

  rabbitmq:
    image: rabbitmq:4.3-alpine
    environment:
      RABBITMQ_DEFAULT_USER: extension
      RABBITMQ_DEFAULT_PASS: extension

  mongodb:
    image: mongo:8.0.29-noble

  kafka:
    image: apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: -Xmx384m -Xms128m

  samba:
    image: crazymax/samba@sha256:b37f7af97c773eddb593537f64da6389e5ee6695bcecf44f3ba1a8a6bcf34125
    tmpfs:
      - /samba/test:mode=1777
    volumes:
      - ./samba.yml:/data/config.yml:ro

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: [sqlserver]
    environment:
      ACCEPT_EULA: Y
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: Extension_Test123!
      MSSQL_MEMORY_LIMIT_MB: 2048
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q 'SELECT 1' -b -l 2 > /dev/null"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 24
